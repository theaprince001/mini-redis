name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify wrapper checksum
        run: ./gradlew --version

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Install redis-tools
        run: sudo apt-get update && sudo apt-get install -y redis-tools netcat-openbsd

      - name: Install server distribution
        run: ./gradlew :redis-server:installDist --no-daemon

      - name: Smoke test with real redis-cli
        run: |
          ./redis-server/build/install/miniredis-server/bin/miniredis-server &
          SERVER_PID=$!
          for i in $(seq 1 40); do
            if redis-cli -p 6379 PING >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          set -e
          test "$(redis-cli -p 6379 PING)" = "PONG"
          test "$(redis-cli -p 6379 ECHO hello)" = "hello"
          test "$(redis-cli -p 6379 PING hi)" = "hi"
          # Raw protocol error via netcat
          RESULT=$(printf '!bad\r\n' | nc -w 1 127.0.0.1 6379 || true)
          echo "$RESULT" | grep -q "Protocol error: expected array"
          kill $SERVER_PID
          echo "smoke test passed"